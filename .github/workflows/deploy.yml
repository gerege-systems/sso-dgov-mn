# Continuous deployment — deploys to the production VPS (dan.dgov.mn) ONLY after
# the CI workflow succeeds on main, so a red build never ships. Triggered via
# `workflow_run` (chained after CI) instead of `push`, which is why CI and
# Deploy no longer start in parallel. The remote step rebuilds/restarts the
# compose stack via deploy/deploy.sh. Secrets: DEPLOY_HOST / DEPLOY_USER /
# DEPLOY_PORT / DEPLOY_PATH / DEPLOY_SSH_KEY (dedicated non-root `deploy` user,
# key-only). Manual re-deploy: workflow_dispatch (deploys origin/main HEAD).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch: {}

# Never run two production deploys at once; let an in-flight deploy finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Gate: manual dispatch always runs; the CI-chained run deploys only when CI
    # passed on the main branch (skips PR CI runs and failed/cancelled builds).
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          DPATH: ${{ secrets.DEPLOY_PATH }}
          # AES-GCM түлхүүр (superadmin MFA / integrations). deploy.sh нь
          # backend.env-д байхгүй бол л нэг удаа бичнэ. Secret тохируулаагүй бол
          # хоосон дамжина → deploy.sh алгасна (аюулгүй).
          ENC_KEY: ${{ secrets.INTEGRATION_ENC_KEY }}
          # Exact commit that passed CI (empty on manual dispatch → origin/main HEAD).
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" -o IdentitiesOnly=yes \
            "$USER@$HOST" \
            "set -euo pipefail; \
             cd '${DPATH:-/srv/dan}'; \
             git fetch --prune origin; \
             TARGET='${TARGET_SHA:-}'; \
             if [ -n \"\$TARGET\" ]; then \
               echo \"▶ Deploying CI-passed commit \$TARGET\"; \
               git reset --hard \"\$TARGET\"; \
             else \
               echo '▶ Deploying origin/main HEAD (manual dispatch)'; \
               git reset --hard origin/main; \
             fi; \
             echo \"▶ Now at: \$(git rev-parse --short HEAD) — \$(git log -1 --pretty=%s)\"; \
             INTEGRATION_ENC_KEY='$ENC_KEY' bash deploy/deploy.sh"
