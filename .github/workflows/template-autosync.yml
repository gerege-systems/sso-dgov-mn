# template-dgov-mn → энэ платформ: автомат удамшлын САНАЛ (PR).
#
# Gov урсгалын суурь template-д өөрчлөлт орох бүрд энэ ажил түүнийг татаж
# merge хийж үзнэ. Зөрүүтэй файлууд (`.gitattributes` дахь `merge=ours`)
# автоматаар манайх хэвээр үлдэнэ, иймд ердийн тохиолдолд conflict гарахгүй.
#
# Conflict гарвал: merge-ийг цуцалж, issue үүсгэн хүнийг дуудна — чимээгүй
# хоцрохоос сэргийлнэ.
name: template-autosync

on:
  schedule:
    # Өдөрт нэг удаа (UTC 04:03) — template-ийн өөрийн autosync дууссаны дараа.
    - cron: '3 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  # ci.yml-ийг branch дээр дуудахад шаардлагатай — үгүй бол HTTP 403
  # «Resource not accessible by integration».
  actions: write

concurrency:
  group: template-autosync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Тохиргоо
        run: |
          git config user.name  'gerege-template-autosync[bot]'
          git config user.email 'gerege-template-autosync@users.noreply.github.com'
          # .gitattributes дахь `merge=ours`-ийг ажиллуулна.
          git config merge.ours.driver true
          # `template-dgov-mn` нь НЭЭЛТТЭЙ репо тул нэмэлт эрх шаардлагагүй.
          git remote add upstream https://github.com/gerege-systems/template-dgov-mn.git
          git fetch upstream main

      - name: Шинэ commit байгаа эсэх
        id: check
        run: |
          n=$(git rev-list --count HEAD..upstream/main)
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "upstream-аас $n commit хоцорсон."

      - name: Merge
        id: merge
        if: steps.check.outputs.n != '0'
        run: |
          if git merge --no-edit upstream/main; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt
            git merge --abort
          fi

      # ⚠️ Энэ бол production платформ — main руу push хийвэл шууд deploy
      # ажиллана. Тиймээс автомат merge-ийг ШУУД оруулахгүй, PR болгож
      # хүний хяналтад өгнө.
      #
      # ⚠️ PR-ийг ЗААВАЛ merge commit-оор нэгтгэнэ (squash биш) — squash хийвэл
      # upstream-тэй холбосон эцэг алдагдаж, дараагийн merge дахин бүх түүхийг
      # авчирна.
      - name: PR болгож санал болгох
        id: pr
        if: steps.merge.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          br="autosync/template-$(git rev-parse --short upstream/main)"
          echo "br=$br" >> "$GITHUB_OUTPUT"
          git push -f origin "HEAD:$br"
          # --repo ЗААВАЛ: энэ репод upstream remote нэмэгддэг тул gh нь
          # түүнийг сонгоод буруу (upstream) репод хандана.
          if out=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$br" \
            --title "autosync: template-dgov-mn-ээс $(git rev-parse --short upstream/main)" \
            --body $'`template-dgov-mn`-ээс автоматаар merge хийв. CI ногоон бол merge хийнэ үү — merge хийх нь production deploy ажиллуулна.\n\n**Merge commit-оор** нэгтгэнэ үү (squash биш): squash нь удамшлын холбоосыг таслана.' \
            2>&1); then
            echo "$out"
          elif [ -n "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$br" --state open \
                        --json number --jq '.[0].number // empty')" ]; then
            echo "PR аль хэдийн байна ($br)."
          else
            # Өмнө нь энэ алдаа `2>/dev/null`-д залгигдаж, ажил ногоон дуусдаг
            # байсан — удамшил чимээгүй зогсох гол шалтгаан. Одоо улаан болно.
            echo "::error::PR үүсгэж чадсангүй: $out"
            exit 1
          fi

      # `GITHUB_TOKEN`-оор үүсгэсэн PR нь workflow ӨДӨӨДӨГГҮЙ (GitHub-ийн рекурс
      # хамгаалалт). Иймд autosync-ийн PR дээр шалгалт огт ажиллахгүй — «хоосон
      # ногоон» харагдаж, шалгагдаагүй код merge хийгдэх эрсдэлтэй. Тиймээс CI-г
      # branch дээр нь өөрсдөө дуудна.
      #
      # Production аюулгүй: deploy нь `main`-д уягдсан
      # (`github.ref == 'refs/heads/main'` эсвэл `workflow_run.head_branch == 'main'`)
      # тул энэ дуудлагаас байршуулалт хөдлөхгүй.
      - name: PR дээр CI дуудах
        if: steps.merge.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" \
            --ref "${{ steps.pr.outputs.br }}"
          echo "CI дуудагдав → ${{ steps.pr.outputs.br }}"

      - name: Conflict — issue үүсгэх
        if: steps.merge.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$'`template-dgov-mn`-ээс автомат merge хийх үед conflict гарлаа.\n\n**Зөрчилтэй файлууд:**\n```\n'
          body+="$(cat /tmp/conflicts.txt)"
          body+=$'\n```\n\nГараар шийдэх:\n```bash\ngit remote add upstream https://github.com/gerege-systems/template-dgov-mn.git\ngit fetch upstream main\ngit config merge.ours.driver true\ngit merge upstream/main\n```\n\nХэрэв зөрүү нь зориудынх бол `.gitattributes`-д `merge=ours` нэмнэ.'
          gh issue create --repo "$GITHUB_REPOSITORY" --title "template-autosync: upstream merge conflict" --body "$body" --label autosync 2>/dev/null \
            || gh issue create --repo "$GITHUB_REPOSITORY" --title "template-autosync: upstream merge conflict" --body "$body"

      - name: Дүн
        if: always()
        run: |
          echo "### template-autosync" >> "$GITHUB_STEP_SUMMARY"
          echo "- upstream: \`template-dgov-mn\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- хоцорсон commit: ${{ steps.check.outputs.n }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- merge: ${{ steps.merge.outputs.ok || 'хийх зүйлгүй' }}" >> "$GITHUB_STEP_SUMMARY"
