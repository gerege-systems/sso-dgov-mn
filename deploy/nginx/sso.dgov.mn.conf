# sso.dgov.mn — Цахим Засгийн нэвтрэлт.
#
# Upstream портууд нь энэ репогийн deploy/docker-compose.yml-ийнх, зөвхөн
# loopback дээр: 3016 бүрхүүл, 8096 API. Хажууд нь open.dgov.mn (3008 / 8082)
# ажиллаж байгаа тул дугаарууд ялгаатай.
#
# server_name нь яг нэг хост. dgov.mn, open.dgov.mn, sso.dgov.mn гурвуулаа
# ижил IP рүү заадаг тул `default_server` ч, wildcard ч биш байх нь заавал:
# хөршийнхөө урсгалыг залгичихна.
#
# Энэ файлыг certbot-оос ӨМНӨ суулгана. Certbot үүнийг өөрөө засаж
# `listen 443 ssl` мөрүүд, 80 → https чиглүүлэгч блокийг нэмнэ. Тэдгээрийг
# гараар бичих хэрэггүй — сунгалт нь өөрийнхөө тэмдэглэгээг олохоо болино.

# Нэрийн угтвар нь заавал: энэ хост нэгээс олон сайт үйлчилдэг ба
# /etc/nginx доор ижил нэртэй хоёр дахь зона бол бүгдийнх нь `nginx -t`-г
# унагаах давхардлын алдаа.
limit_req_zone $binary_remote_addr zone=sso_dgov_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=sso_dgov_oauth:10m rate=30r/m;

# Websocket upgrade-ийг клиент үнэхээр хүссэн үед л дамжуулна; хүсэлт бүр дээр
# `Connection: upgrade` илгээх нь энгийн HTTP keep-alive-ыг эвдэнэ.
map $http_upgrade $sso_dgov_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name sso.dgov.mn;

    # eID-ийн гарын үсгийн upload нь 15MB PDF-ийг base64 JSON-оор авдаг
    # (утсан дээр ~20MB). Nginx-ийн 1m анхдагч тэдгээрийг API хүртэл
    # хүрэхээс өмнө 413-аар буцаана.
    client_max_body_size 25m;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        # Next.js энд өөрийн header тавьдаггүй (next.config байхгүй), nginx нь
        # өөрөө header зарласан location руу add_header-ээ өвлүүлдэггүй — тул
        # нэвтрэх хуудсанд яг энд бичигдэнэ. API нь өөрийнхөө багцыг
        # security.HeadersMiddleware дотор тавьдаг; доорх /api/, /oauth2/,
        # /.well-known/ дээр давхардуулж болохгүй.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        proxy_pass http://127.0.0.1:3016;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sso_dgov_connection_upgrade;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8096/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /auth/eid/poll нь 25 секунд онгорхой байдаг long poll. Анхдагч 60s
        # багтаах ч хэн нэгэн сохроор чангалахгүйн тулд бичив.
        proxy_read_timeout 90s;
    }

    # Хязгаарлалт орох цэг дээрээ. Энэ бол Цахим Засгийн identity-гийн эх
    # сурвалж: нууц үг таах төсвийг энд л таслах ёстой.
    location ~ ^/api/v1/auth/(login|eid/login|eid/start|eid/start-id|dan/login)$ {
        limit_req zone=sso_dgov_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth2 / OIDC провайдер нь API-гийн үндэс дээр суудаг, /api/ доор биш
    # (server.go: /.well-known/openid-configuration, /.well-known/jwks.json,
    # /oauth2/token|introspect|revoke). SSO_ISSUER нь энэ origin тул
    # discovery яг эдгээр замыг зарлана — бүрхүүл рүү чиглүүлбэл 404 болж,
    # open.dgov.mn токен шалгаж чадахгүй.
    #
    # acme-challenge нь дээрээ, урт угтвар тул certbot ялсан хэвээр.
    location /.well-known/ {
        proxy_pass http://127.0.0.1:8096/.well-known/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /oauth2/token {
        limit_req zone=sso_dgov_oauth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth2/ {
        proxy_pass http://127.0.0.1:8096/oauth2/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /health, /ready, /metrics зориуд дамжуулагдаагүй — rollout тэдгээрийг
    # серверийн дээрээ loopback-аар шалгана.
}
