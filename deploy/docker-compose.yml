# Цахим Засгийн нэвтрэлт — sso.dgov.mn.
#
# Энэ бол Gerege SSO бүтээгдэхүүнийг Цахим Засгийн хост дээр асаах compose.
# Бүтээгдэхүүн нь платформын тусгай build биш: ижил платформ дээр дөрвөн
# модуль нэмж, энэ репогийн каталогийг зааж өгсөн өөрийн бинар.
#
# Хост дээр аль хэдийн `open.dgov.mn` (dgov_nexus_*) ажиллаж байна — 5434
# postgres, 6381 redis, 8082 backend, 3008 бүрхүүл. Энэ стек түүний ХАЖУУД
# өөрийн порт, өөрийн өгөгдлийн сангаар босно; түүнд юу ч хөндөгдөхгүй.
# Хоёулаа loopback дээр, гадагшаа nginx л гаргана.
#
# ЧУХАЛ: `open.dgov.mn` бол ЭНЭ суулгацын клиент (`SSO_CLIENT_ISSUER=
# https://sso.dgov.mn`). Тиймээс SSO_ISSUER нь энэ origin — nexus.gerege.mn
# биш. Issuer солих нь тухайн үед бүртгэлтэй RP бүрийн хийх өөрчлөлт.
#
# Шаардлагатай орчин (deploy/.env — .env.example-ийг үз):
#   SSO_DGOV_POSTGRES_PASSWORD  энэ стекийн өөрийн өгөгдлийн сан
#   SSO_SECRET_KEY              base64, 32 байт: federation-ы client secret ба
#                               SCIM токеныг шифрлэдэг түлхүүр. Алдвал бүх
#                               итгэмжлэлийг дахин оруулна; солих нь
#                               хадгалагдсан нь задрахаа болино гэсэн үг.
#   SSO_DEFAULT_CLIENT_SECRET   production дээр байхгүй бол цөм асахаас
#                               татгалзана.
#   OAUTH_REDIRECT_HOSTS        `open.dgov.mn` — жагсаалт дэд домэйн өвлүүлдэггүй.

# Төслийн нэрийг хавтаснаас биш эндээс авна: эс тэгвэл compose «deploy» гэж
# нэрлээд, хөршийнхөө барьж байгаа нэрсээр хоёр дахь стек барина.
name: sso-dgov

services:
  postgres:
    image: postgres:16-alpine
    container_name: dgov_sso_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: platform_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SSO_DGOV_POSTGRES_PASSWORD:?SSO_DGOV_POSTGRES_PASSWORD шаардлагатай}
    # Өөрийн порт: 5434-ийг open.dgov.mn барьж байна. Энэ хост дээр портууд
    # эхэлж ирсэн нь эзэмшдэг тул мөргөлдөөн бол буруу асдаг стек биш,
    # огт асдаггүй стек.
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - dgov_sso_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: ${IMAGE:-sso-dgov:latest}
    container_name: dgov_sso_migrate
    # Платформын миграцууд, энэ бүтээгдэхүүний go.mod түгжсэн цөмийн
    # хувилбараас — образ хоёуланг нь агуулдаг тул салж хоцрох аргагүй.
    command: ["/app/migrate", "up"]
    environment:
      DATABASE_URL: postgres://postgres:${SSO_DGOV_POSTGRES_PASSWORD}@postgres:5432/platform_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Энэ бүтээгдэхүүний өөрийн миграцууд, өөрийн түүхэндээ.
  #
  # Нэг санд хоёр түүх байгаа тул MIGRATIONS_TABLE нь сонголт биш: goose нэг
  # хүснэгтэд хувилбар тус бүрээр нэг мөр хадгалдаг, тэгэхээр энэ
  # бүтээгдэхүүний 00001 ба платформын 00001 нэг мөр болж, хоёр дахь нь
  # аль хэдийн хийгдсэн гэж бүртгэгдэнэ.
  migrate-sso:
    image: ${IMAGE:-sso-dgov:latest}
    container_name: dgov_sso_migrate_own
    command: ["/app/migrate", "up"]
    environment:
      DATABASE_URL: postgres://postgres:${SSO_DGOV_POSTGRES_PASSWORD}@postgres:5432/platform_db?sslmode=disable
      MIGRATIONS_DIR: /app/db/sso
      MIGRATIONS_TABLE: goose_db_version_sso
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    image: ${IMAGE:-sso-dgov:latest}
    # Нийтлэгдсэн образ байхгүй: энэ репод цөмийн код байхгүй ч бинар нь
    # эндээс баригддаг. deploy.sh хостын дээр барина.
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: dgov_sso_backend
    restart: unless-stopped
    # Энэ байрлуулалтын барьдаг, бүтээгдэхүүний шийддэггүй бүх зүйл: eID-ийн
    # RP итгэмжлэл, Google/Dropbox-ын нууц, брэндийн нэр, гарын үсгийн
    # сертификат. Доорх тодорхой блок нь бүтээгдэхүүнд бодол байгаа газартаа
    # хэвээр давамгайлна.
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:${SSO_DGOV_POSTGRES_PASSWORD}@postgres:5432/platform_db?sslmode=disable
      ENVIRONMENT: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://sso.dgov.mn}
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-https://sso.dgov.mn}

      # Энэ бүтээгдэхүүний өөрийн каталог, образ дотор ирсэн: дөрвөн SSO
      # модуль ба хажууд нь суудаг платформын гурван апп.
      APP_CATALOG_PATH: /app/catalog/apps.json

      # Federation-ы client secret ба SCIM токеныг юугаар шифрлэх. Байхгүй ч
      # бүтээгдэхүүн асна, бусад бүх дэлгэц ажиллана — татгалзах нь
      # итгэмжлэлийг цэвэр текстээр хадгалах гэсэн бичилт.
      SSO_SECRET_KEY: ${SSO_SECRET_KEY:-}

      # Энэ суулгац бол Цахим Засгийн identity-гийн ЭХ СУРВАЛЖ. open.dgov.mn
      # нь SSO_CLIENT_ISSUER=https://sso.dgov.mn гэж заасан тул discovery,
      # токены `iss` бүгд яг энэ хаяг байх ёстой.
      SSO_ISSUER: ${PUBLIC_ORIGIN:-https://sso.dgov.mn}
      SSO_DEFAULT_CLIENT_SECRET: ${SSO_DEFAULT_CLIENT_SECRET}
      # Дотоод клиентийн эзэн тенант. Анхдагч нь "demo" — байхгүй тенантад
      # клиент үүсгэхгүй, чимээгүй алгасна.
      SSO_DEFAULT_CLIENT_TENANT: ${SSO_DEFAULT_CLIENT_TENANT:-dgov}

      # Хурдны хязгаарлалт хүн бүрийг nginx гэж үзэхгүйн тулд. Энэ стек
      # зөвхөн loopback дээр сонсдог тул X-Forwarded-For-ыг өөр хэн ч
      # хуурамчаар өгөх боломжгүй.
      TRUST_PROXY_HEADERS: "true"

      DEMO_MODE: "false"
    # Өөрийн порт: 8082-ыг open.dgov.mn барьж байна.
    ports:
      - "127.0.0.1:8096:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      migrate-sso:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Платформын өөрийн бүрхүүл, өөрчлөгдөөгүй — бас эндээс баригдаагүй.
  #
  # Distribution нь frontend-ээ fork хийдэггүй: хажуугийн цэс, модулийн
  # дэлгэцүүд каталогоор явдаг тул ерөнхий бүрхүүл энэ бүтээгдэхүүнийг аль
  # хэдийн зурдаг. Урьд нь origin бүрээр дахин барих шаардлагатай байсан
  # (API-гийн хаяг bundle дотор компилдэгддэг байсан); цөм үүнийг больсон —
  # frontend/lib/apiBase.ts, хөтөч одоо өөрийн origin-оос асууна.
  #
  # WEB_IMAGE нь тодорхой commit дээр түгжигдсэн, `latest` биш: «өчигдөр
  # ажиллаж байсан» гэдэг нь тодорхой хувилбар байх ёстой. Одоо түгжигдсэн
  # d135c887 бол хажуугийн open.dgov.mn-ий яг ажиллуулж байгаа бүрхүүл —
  # нэг хост дээр хоёр өөр насны shell байлгах шалтгаан алга.
  web:
    image: ${WEB_IMAGE:-ghcr.io/gerege-systems/open-gerege-nexus/frontend:d135c8871b0e5c0f99a25c0b316979d2e0c5f76c}
    container_name: dgov_sso_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Сервер талаас нь энэ суулгац юу агуулж байгааг бүрхүүл хаанаас
      # асуух — каталог нь HTML дотор ирнэ, дараа нь солигдох биш. Хөтөч
      # үүнийг хэзээ ч ашиглахгүй: тэр өөрийн origin-оос асууна. Сервэрт
      # origin гэж байхгүй, энэ мөр яг тийм учраас байна.
      API_INTERNAL_URL: http://backend:8080/api/v1
      # Брэнд бүрхүүлийн талд ч хэрэгтэй: /login дэлгэц дээрх нэр.
      BRAND_NAME: ${BRAND_NAME:-}
      BRAND_SHORT_NAME: ${BRAND_SHORT_NAME:-}
      BRAND_DESCRIPTION: ${BRAND_DESCRIPTION:-}
      BRAND_THEME_COLOR: ${BRAND_THEME_COLOR:-}
      BRAND_LOGO_URL: ${BRAND_LOGO_URL:-}
      BRAND_ICON_URL: ${BRAND_ICON_URL:-}
      # Энэ суулгацын өөрийн гарын авлага. Хоосон бол цэсний «Баримт бичиг»
      # платформын номыг нээнэ — тэр нь энэ бүтээгдэхүүний тухай биш.
      BRAND_DOCS_URL: ${BRAND_DOCS_URL:-}
      # Landing page-ийн хэсгүүд. Энэ бол нэвтрэлтийн провайдер: архитектур,
      # бизнес аппын каталог, платформын суурь гурав нь хөршийн хийдэг
      # маргаан болохоос эндхийнх биш.
      LANDING_SECTIONS: ${LANDING_SECTIONS:-}
      # Тэдгээр хэсгийн үгс. brandCopy нь яг үүний төлөө байдаг: нэрийг нь
      # солих нь дахин байрлуулалт биш, хуудсыг өөр зүйлийн тухай болгох нь
      # дахин байрлуулалт.
      BRAND_COPY_FILE: /brand/copy.json
    volumes:
      # copy.json-ыг уншихаар. nginx мөн энэ лавлахаас /brand/… -г шууд
      # өгдөг — тэр нь хостын зам, энэ нь контейнерийн; хоёр өөр зорилготой
      # нэг хавтас.
      - ./brand:/brand:ro
    # 3008-ыг open.dgov.mn барьж байна.
    ports:
      - "127.0.0.1:3016:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  dgov_sso_postgres_data:
